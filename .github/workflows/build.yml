name: Build & Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build-app:
    name: Build macOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '15.0'
        
    - name: Build App
      run: |
        xcodebuild -scheme AIC8800WiFi \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
          
    - name: Upload Build Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: AIC8800WiFi-App
        path: build/Build/Products/Release/AIC8800WiFi.app
        retention-days: 30

  build-dext:
    name: Build DriverKit Extension
    runs-on: macos-14
    
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: '15.0'
        
    - name: Build DEXT
      run: |
        xcodebuild -scheme AIC8800WiFi_DEXT \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
          
    - name: Upload Build Artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: AIC8800WiFi-DEXT
        path: build/Build/Products/Release/AIC8800WiFi_DEXT.dext
        retention-days: 30

  release:
    name: Create Release
    needs: [build-app, build-dext]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Download App Artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: AIC8800WiFi-App
        
    - name: Download DEXT Artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: AIC8800WiFi-DEXT
        
    - name: Create ZIP
      run: |
        zip -r AIC8800WiFi-macOS.zip AIC8800WiFi.app AIC8800WiFi_DEXT.dext
        
    - name: Upload to Release
      uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
      with:
        files: AIC8800WiFi-macOS.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
